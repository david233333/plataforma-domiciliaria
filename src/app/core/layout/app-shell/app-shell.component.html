<!--
  App shell (TEMPLATE). Layout con utilidades Tailwind + tokens del sistema.
  - Header fijo (no lo tapa el drawer): el drawer abre con offset = altura del header.
  - Drawer de PrimeNG (menú lateral) en modo NO modal: no oscurece ni cubre el header.
  - El contenido enrutado entra con fade vía `animate.enter` (Angular 21).
  - Las acciones del header se PROYECTAN (ng-content): el shell no conoce presentation.
-->
<a
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50"
  href="#contenido"
>
  Saltar al contenido
</a>

<!-- ============================ HEADER FIJO ============================ -->
<header class="app-header flex items-center gap-3">
  <p-button
    [text]="true"
    [rounded]="true"
    severity="secondary"
    icon="pi pi-bars"
    ariaLabel="Abrir menú"
    [attr.aria-expanded]="drawerVisible()"
    (onClick)="toggleDrawer()"
  />
  <a routerLink="/inicio" class="app-brand" aria-label="Sura — Plataforma Domiciliaria">
    <img
      ngSrc="logo-sura.svg"
      width="139"
      height="48"
      priority
      alt="Sura"
      class="app-brand__logo"
    />
    <span class="app-brand__divider" aria-hidden="true"></span>
    <span class="text-label-lg app-brand__name">Plataforma Domiciliaria</span>
  </a>

  <!-- Acciones del extremo derecho (menú de usuario…): las inyecta app-root. -->
  <div class="ml-auto flex items-center gap-2">
    <span class="app-header__sep" aria-hidden="true"></span>
    <ng-content select="[header-actions]" />
  </div>
</header>

<!-- ============================ DRAWER / MENÚ ============================ -->
<p-drawer
  [(visible)]="drawerVisible"
  position="left"
  [modal]="false"
  [closable]="true"
  [closeOnEscape]="false"
  styleClass="app-drawer"
  [style]="{
    top: 'var(--app-header-height)',
    height: 'calc(100dvh - var(--app-header-height))',
    width: 'var(--app-drawer-width)'
  }"
>
  <ng-template #header>
    <span class="text-overline">Navegación</span>
  </ng-template>

  <nav class="flex flex-col gap-4" aria-label="Menú principal">
    <a
      class="nav-item"
      [routerLink]="inicioItem.route"
      routerLinkActive="nav-item--active"
    >
      <i class="pi {{ inicioItem.icon }}"></i>
      <span class="text-label-md">{{ inicioItem.label }}</span>
    </a>

    @for (section of navSections; track section.key) {
      @let expanded = expandedSections()[section.key];
      <div class="nav-section">
        <button
          type="button"
          class="nav-section__header"
          [attr.aria-expanded]="expanded"
          [attr.aria-controls]="'nav-section-' + section.key"
          (click)="toggleSection(section.key)"
        >
          <span class="text-overline">{{ section.label }}</span>
          <i
            class="pi pi-chevron-down nav-section__chevron"
            [class.nav-section__chevron--collapsed]="!expanded"
            aria-hidden="true"
          ></i>
        </button>

        @if (expanded) {
          <div class="flex flex-col gap-1" [id]="'nav-section-' + section.key">
            @for (item of section.items; track item.route) {
              <a
                class="nav-item"
                [routerLink]="item.route"
                routerLinkActive="nav-item--active"
              >
                <i class="pi {{ item.icon }}"></i>
                <span class="text-label-md">{{ item.label }}</span>
              </a>
            }
          </div>
        }
      </div>
    }
  </nav>
</p-drawer>

<!-- ============================ CONTENIDO ============================ -->
<main
  id="contenido"
  class="app-main"
  [class.app-main--drawer-open]="drawerVisible()"
  [animate.enter]="routeFade"
>
  <router-outlet />
</main>
