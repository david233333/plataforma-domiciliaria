<!--
  App shell. Layout con utilidades Tailwind + tokens del sistema.
  - Header fijo (no lo tapa el drawer): el drawer abre con offset = altura del header.
  - Drawer de PrimeNG (menú lateral) en modo NO modal: no oscurece ni cubre el header.
  - El contenido enrutado entra con fade vía `animate.enter` (Angular 21).
-->
<a
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50"
  href="#contenido"
>
  Saltar al contenido
</a>

<!-- ============================ HEADER FIJO ============================ -->
<header class="app-header flex items-center gap-3">
  <p-button
    [text]="true"
    [rounded]="true"
    severity="secondary"
    icon="pi pi-bars"
    ariaLabel="Abrir menú"
    [attr.aria-expanded]="drawerVisible()"
    (onClick)="toggleDrawer()"
  />
  <a routerLink="/novedades" class="text-label-lg" style="color: var(--app-text-primary)">
    Plataforma Domiciliaria
  </a>
</header>

<!-- ============================ DRAWER / MENÚ ============================ -->
<p-drawer
  [(visible)]="drawerVisible"
  position="left"
  [modal]="false"
  [closable]="true"
  [closeOnEscape]="false"
  styleClass="app-drawer"
  [style]="{
    top: 'var(--app-header-height)',
    height: 'calc(100dvh - var(--app-header-height))',
    width: 'var(--app-drawer-width)'
  }"
>
  <ng-template #header>
    <span class="text-overline">Navegación</span>
  </ng-template>

  <nav class="flex flex-col gap-1" aria-label="Menú principal">
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
      >
        <i class="pi {{ item.icon }}"></i>
        <span class="text-label-md">{{ item.label }}</span>
      </a>
    }
  </nav>
</p-drawer>

<!-- ============================ CONTENIDO ============================ -->
<main
  id="contenido"
  class="app-main"
  [class.app-main--drawer-open]="drawerVisible()"
  [animate.enter]="routeFade"
>
  <router-outlet />
</main>
