<!--
  CREAR SOLICITUD — pantalla SMART. La página solo orquesta: provee el store,
  compone las secciones y las revela de forma PROGRESIVA según los `computed`
  del store. El estado vive en el store, no aquí.
-->
<div class="container-fluid section animate-fade-in">
  <app-page-header
    class="mb-8"
    overline="No hospitalario"
    title="Nueva solicitud"
    description="Consulta la cobertura del paciente y completa los datos del servicio."
    icon="file-edit"
  />

  <!-- Columna principal a ancho completo: los formularios aprovechan todo el
       espacio horizontal. El panel de resumen se reincorporará al final. -->
  <div class="flex flex-col gap-6">
    <app-seccion-cobertura />

    @if (store.coberturaResuelta()) {
      <app-seccion-paciente />
      <app-seccion-servicio />

      <app-form-actions divider>
        <app-button
          label="Reiniciar"
          icon="times"
          severity="secondary"
          variant="text"
          (clicked)="store.reiniciar()"
        />
        <app-button
          label="Guardar solicitud"
          icon="check"
          [loading]="store.guardando()"
          [disabled]="!store.puedeGuardar()"
          (clicked)="store.guardar()"
        />
      </app-form-actions>
    }
  </div>

  <!-- TODO: Panel de resumen — pendiente para el final.
  <aside class="lg:sticky lg:top-6">
    <app-resumen-solicitud />
  </aside>
  -->
</div>
